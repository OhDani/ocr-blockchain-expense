[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules", "../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Remappings để Foundry tự động đọc @openzeppelin từ node_modules của workspace
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]

fs_permissions = [{ access = "read", path = "../node_modules" }]

# Cấu hình mạng Linea & Sepolia
[rpc_endpoints]
sepolia = "${BLOCKCHAIN_RPC_URL}"
linea_sepolia = "https://rpc.sepolia.linea.build"
linea_mainnet = "https://rpc.linea.build"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
linea_sepolia = { key = "${LINEASCAN_API_KEY}", url = "https://api-sepolia.lineascan.build/api" }
